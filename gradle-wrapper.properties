name: Build Rigelsan MSDK APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Manuel tetikleme için

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify DJI MSDK is bundled
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "APK boyut: $(stat -c%s $APK) bytes"
          echo "Native lib sayısı: $(unzip -l $APK | grep 'lib/arm64-v8a/lib' | wc -l)"
          echo "DJI SDKManager sınıfı kontrolü:"
          if unzip -p $APK classes.dex classes2.dex classes3.dex 2>/dev/null | strings | grep -q "dji.v5.manager.SDKManager"; then
            echo "✓ DJI MSDK V5 sınıfları APK'da gömülü — build başarılı"
          else
            echo "✗ HATA: DJI MSDK sınıfları APK'da YOK — build.gradle yanlış"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rigelsan-msdk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
