## RC Plus 2'ye yükleme

```bash
adb devices                       # cihaz görünüyor mu?
adb install -r app-debug.apk      # yükle
adb logcat -c                     # log temizle
adb logcat | grep -iE "RAS\.|dji|msdk" > rigelsan-log.txt   # log başlat
```

Sonra RC Plus 2'de Rigelsan MSDK uygulamasını aç:

1. **İzin pop-up'ları** çıkacak — hepsine "İzin Ver"
2. **Splash ekranı** "DJI MSDK V5 BAŞLATILIYOR" gösterecek
3. **Init progress** "INITIALIZE_COMPLETE (100%)" göstermeli
4. **Registration** başarılı olmalı: "✓ KAYIT BAŞARILI"
5. **Drone'u aç** — splash ekranında "Drone bağlandı" mesajı
6. **MainActivity** açılır — telemetri ve kamera akışı gelir

### Beklenen sonuçlar

| Aşama | Beklenen | Sorun varsa |
|---|---|---|
| Splash başlatma | `INITIALIZE_COMPLETE` | MSDK init failure → build hatası |
| Registration | `✓ KAYIT BAŞARILI` | App Key veya internet sorunu |
| Drone bağlantısı | `Drone bağlandı (id: ...)` | RC ↔ drone fiziksel bağlantı |
| Telemetri | Batarya, GPS, konum dolar | KeyManager subscription sorunu |
| Kamera | Surface'da canlı görüntü | M4T'de kamera index farklı olabilir |

