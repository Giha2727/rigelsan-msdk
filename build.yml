# Rigelsan MSDK Test — Drone Bağlantı Doğrulama Uygulaması

**RIGELSAN ARGE SAVUNMA — DJI MSDK V5 Sağlık Testi**

EGM Kenevir Tespit APK'sının çalışmamasının sebebini kanıtlamak için yazılan minimal MSDK V5 uygulaması. Drone'a bağlanır, telemetriyi gösterir, kamera akışını gösterir. **Tespit, ONNX, alan tarama yok** — sadece bağlantı doğrulama.

---

## EGM'nin yaptığı bug — bizim önlediğimiz

Kenevir Tespit APK'sının logcat çıktısında:

```
NoClassDefFoundError: Failed resolution of: Ldji/v5/manager/SDKManager;
```

Sebep: EGM'nin `app/build.gradle` dosyasında DJI MSDK dependency'sini yanlış yazılması. **Sadece `compileOnly` kullanılmış, `implementation` satırı eksik.**

Bu projede o hatayı yapmamak için `app/build.gradle.kts` içinde **üç dependency satırı**nı doğru yazdık:

```kotlin
implementation("com.dji:dji-sdk-v5-aircraft:5.17.0")          // ← runtime sınıfları
compileOnly("com.dji:dji-sdk-v5-aircraft-provided:5.17.0")    // ← compile API
runtimeOnly("com.dji:dji-sdk-v5-networkImp:5.17.0")           // ← network impl
```

**Üçü olmadan APK derlenir ama runtime'da crash eder.**

---

## Build adımları

### 1. DJI Developer hesabında yeni App Key oluştur

https://developer.dji.com/user/apps adresine git → "Create App" → bilgileri doldur:

```
SDK Type        : Mobile SDK
App Name        : Rigelsan MSDK Test
Software Platform: Android
Package Name    : com.rigelsan.msdktest    ← KESİNLİKLE BU OLMALI
Category        : Public Safety
Description     : MSDK V5 connectivity test
```

Kaydet → DJI mail gönderir → linke tıkla → App Key oluşturulur.

### 2. App Key'i projeye yapıştır

`app/src/main/res/values/strings.xml` dosyasını aç, şu satırı bul:

```xml
<string name="dji_api_key">YOUR_DJI_APP_KEY_HERE</string>
```

`YOUR_DJI_APP_KEY_HERE` yerine DJI'den aldığın 32 karakter hex string'i yapıştır.

### 3. Android Studio'da projeyi aç

```
File → Open → RigelsanMSDK klasörünü seç
```

İlk Gradle sync 5-15 dakika sürer (DJI MSDK V5 ~250MB native lib indiriyor).

### 4. APK build

**Debug build (test için):**

```bash
./gradlew assembleDebug
# Çıktı: app/build/outputs/apk/debug/app-debug.apk
```

**Release build (signed):**

```bash
./gradlew assembleRelease \
    -PkeystorePath=/path/to/rigelsan-kenevir-release.jks \
    -PkeystorePassword=rigelsan2026 \
    -PkeyAlias=rigelsan-kenevir \
    -PkeyPassword=rigelsan2026
```

### 5. APK doğrulaması

Build sonrası APK içinde DJI MSDK'nın gerçekten gömülü olduğunu kontrol et:

```bash
unzip -l app-debug.apk | grep "lib/arm64-v8a/lib" | wc -l
# Beklenen: 40+ (DJI native lib'leri)

# DEX'te dji.v5.manager.SDKManager var mı?
unzip -p app-debug.apk classes.dex | strings | grep "dji.v5.manager.SDKManager"
# Beklenen: en az bir satır eşleşme
```

**Eğer ikinci komut hiç çıktı vermezse — EGM'nin yaptığı hatayı yapmışsın demektir, build.gradle'ı kontrol et.**

