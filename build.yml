## Sonraki adımlar (uygulama bağlanırsa)

Bu uygulama **çalışırsa** Rigelsan'ın kendi MSDK V5 entegrasyonunu kurmuş olur. Üzerine eklenecekler:

1. **ONNX Runtime entegrasyonu** — `kenevir_model.onnx`'i yükleyip kamera frame'i üzerinde inference
2. **Tespit overlay'i** — frame üstüne YOLO bbox çizimi
3. **MAVLink + Proportional Navigation** — RAS projesindeki gibi guidance
4. **Alan tarama mantığı** — waypoint mission generation
5. **Tespit history + raporlama** — Room DB ile

