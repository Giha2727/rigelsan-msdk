## Test senaryoları

### Senaryo A — Her şey çalışırsa

✓ Senin DJI hesabın sağlam, App Key doğru, donanım sağlam.
✓ Sorun **kesinlikle** EGM'nin Kenevir Tespit APK'sının build.gradle'ında.
✓ EGM'ye bu mesajı at: "build.gradle'da DJI dependency `compileOnly` yerine `implementation` ile yazılmalı, kanıt elimde."

### Senaryo B — Registration fail

❌ App Key yanlış veya internet yok.
- Logcat'e bak, `INVALID_APP_KEY` mı `NETWORK_ERROR` mı?
- `INVALID_APP_KEY` → DJI portalında package name'i ve key'i kontrol et
- `NETWORK_ERROR` → RC Plus 2'yi WiFi'ye bağla

### Senaryo C — Registration OK ama drone gelmedi

❌ Donanım/firmware sorunu.
- Pilot 2 ile drone bağlanıyor mu? Bağlanmıyorsa firmware update gerek.
- Bağlanıyorsa, MSDK product enum'ında M4T kayıtlı olmayabilir.

### Senaryo D — Drone bağlandı ama kamera akışı gelmedi

⚠ Kamera index sorunu.
- M4T 4 kamera (Wide/Zoom/Tele/Thermal). Default `LEFT_OR_MAIN` Wide olur.
- Akış gelmezse kodda `cameraIndex` değiştir: `ComponentIndexType.RIGHT`, `UP`, vs.

