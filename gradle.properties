<?xml version="1.0" encoding="utf-8"?>
<androidx.constraintlayout.widget.ConstraintLayout
    xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    xmlns:tools="http://schemas.android.com/tools"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="@color/bg_void">

    <!-- ÜST BAR -->
    <LinearLayout
        android:id="@+id/topBar"
        android:layout_width="0dp"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:gravity="center_vertical"
        android:paddingHorizontal="20dp"
        android:paddingVertical="14dp"
        android:background="@color/bg_panel"
        app:layout_constraintTop_toTopOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent">

        <View android:layout_width="3dp" android:layout_height="22dp"
            android:background="@color/rigel_gold" android:layout_marginEnd="10dp"/>

        <TextView
            android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:text="RIGELSAN MSDK"
            android:textColor="@color/rigel_gold"
            android:textSize="16sp" android:textStyle="bold"
            android:fontFamily="monospace" android:letterSpacing="0.3"/>

        <Space android:layout_width="0dp" android:layout_height="0dp"
            android:layout_weight="1"/>

        <TextView
            android:id="@+id/tvConnectionStatus"
            android:layout_width="wrap_content" android:layout_height="wrap_content"
            android:text="@string/connection_unknown"
            android:textColor="@color/status_error"
            android:textSize="13sp" android:textStyle="bold"
            android:fontFamily="monospace" android:letterSpacing="0.2"
            tools:text="● BAĞLI"/>
    </LinearLayout>

    <!-- ANA İÇERİK: 2 sütun (sol = telemetri, sağ = kamera) -->
    <LinearLayout
        android:id="@+id/contentArea"
        android:layout_width="0dp"
        android:layout_height="0dp"
        android:orientation="horizontal"
        android:padding="12dp"
        app:layout_constraintTop_toBottomOf="@id/topBar"
        app:layout_constraintBottom_toBottomOf="parent"
        app:layout_constraintStart_toStartOf="parent"
        app:layout_constraintEnd_toEndOf="parent">

        <!-- SOL: TELEMETRİ -->
        <ScrollView
            android:layout_width="0dp"
            android:layout_height="match_parent"
            android:layout_weight="0.42"
            android:layout_marginEnd="12dp"
            android:background="@drawable/bg_panel_outline"
            android:padding="16dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">

                <TextView
                    android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="@string/main_section_status"
                    style="@style/RasText.Tag"/>

                <View android:layout_width="match_parent" android:layout_height="1dp"
                    android:background="@color/line_subtle"
                    android:layout_marginVertical="10dp"/>

                <!-- Drone modeli -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_product"/>
                    <TextView android:id="@+id/tvProductType"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="MATRICE_4T"/>
                </LinearLayout>

                <!-- Batarya -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_battery"/>
                    <TextView android:id="@+id/tvBattery"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="87%"/>
                </LinearLayout>

                <!-- GPS sinyal -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_gps_level"/>
                    <TextView android:id="@+id/tvGpsLevel"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="Seviye 5 / 5"/>
                </LinearLayout>

                <!-- Uydu sayısı -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_gps_sats"/>
                    <TextView android:id="@+id/tvGpsSats"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="14 uydu"/>
                </LinearLayout>

                <!-- Motorlar -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_motors"/>
                    <TextView android:id="@+id/tvMotors"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="DURDU"/>
                </LinearLayout>

                <View android:layout_width="match_parent" android:layout_height="1dp"
                    android:background="@color/line_subtle"
                    android:layout_marginVertical="14dp"/>

                <TextView
                    android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="@string/main_section_position"
                    style="@style/RasText.Tag"/>

                <View android:layout_width="match_parent" android:layout_height="1dp"
                    android:background="@color/line_subtle"
                    android:layout_marginVertical="10dp"/>

                <!-- Konum -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_location"/>
                    <TextView android:id="@+id/tvLocation"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="37.066, 37.383"/>
                </LinearLayout>

                <!-- İrtifa -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_altitude"/>
                    <TextView android:id="@+id/tvAltitude"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="42.3 m"/>
                </LinearLayout>

                <!-- Hız -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_speed"/>
                    <TextView android:id="@+id/tvSpeed"
                        style="@style/RasText.Value"
                        android:text="—" android:textSize="11sp"
                        tools:text="0.0 m/s yatay"/>
                </LinearLayout>

                <!-- Uçuş modu -->
                <LinearLayout style="@style/RowStyle">
                    <TextView style="@style/RasText.Label"
                        android:text="@string/label_flight_mode"/>
                    <TextView android:id="@+id/tvFlightMode"
                        style="@style/RasText.Value"
                        android:text="—" tools:text="GPS"/>
                </LinearLayout>

                <com.google.android.material.button.MaterialButton
                    android:id="@+id/btnRefresh"
                    style="@style/RasButton.Outline"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:layout_marginTop="20dp"
                    android:text="@string/btn_refresh"/>

            </LinearLayout>
        </ScrollView>

        <!-- SAĞ: KAMERA AKIŞI -->
        <LinearLayout
            android:layout_width="0dp"
            android:layout_height="match_parent"
            android:layout_weight="0.58"
            android:orientation="vertical">

            <TextView
                android:layout_width="wrap_content" android:layout_height="wrap_content"
                android:text="@string/main_section_camera"
                style="@style/RasText.Tag"
                android:layout_marginBottom="6dp"/>

            <FrameLayout
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:background="@drawable/bg_camera_surface">

                <SurfaceView
                    android:id="@+id/cameraSurface"
                    android:layout_width="match_parent"
                    android:layout_height="match_parent"/>

                <TextView
                    android:id="@+id/tvStreamStatus"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:layout_gravity="center"
                    android:text="@string/stream_waiting"
                    android:textColor="@color/text_secondary"
                    android:textSize="12sp"
                    android:fontFamily="monospace"
                    android:padding="16dp"/>

                <!-- Köşe bracket'leri (HUD görünümü) -->
                <View
                    android:layout_width="20dp" android:layout_height="20dp"
                    android:layout_gravity="top|left" android:layout_margin="8dp"
                    android:background="@drawable/bg_panel_outline"/>
                <View
                    android:layout_width="20dp" android:layout_height="20dp"
                    android:layout_gravity="top|right" android:layout_margin="8dp"
                    android:background="@drawable/bg_panel_outline"/>
                <View
                    android:layout_width="20dp" android:layout_height="20dp"
                    android:layout_gravity="bottom|left" android:layout_margin="8dp"
                    android:background="@drawable/bg_panel_outline"/>
                <View
                    android:layout_width="20dp" android:layout_height="20dp"
                    android:layout_gravity="bottom|right" android:layout_margin="8dp"
                    android:background="@drawable/bg_panel_outline"/>
            </FrameLayout>

        </LinearLayout>

    </LinearLayout>

</androidx.constraintlayout.widget.ConstraintLayout>
